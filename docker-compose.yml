# Local services only. Staging/production use managed Postgres + S3 in the EU.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex"]
      interval: 5s
      retries: 10
  s3:
    image: adobe/s3mock
    environment:
      initialBuckets: apex-media
      retainFilesOnExit: "true"
      root: /data
    ports: ["9090:9090"]
    volumes: ["s3data:/data"]
  mail:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  dbdata:
  s3data:
