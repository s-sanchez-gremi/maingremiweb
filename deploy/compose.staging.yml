# STAGING on a small server: the apps (web, admin, crm, forms), PostgreSQL in Docker, and Caddy. (Production uses IONOS Managed PostgreSQL instead: compose.yml.)
# The database is reachable only from the app (no published port). Its data lives in the "pgdata" volume and is backed up
# to S3 like production (deploy/backup.sh with DOCKER_NETWORK=<project>_default).
name: ${APEX_ENV:-apex-staging}
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: ${APEX_IMAGE:-ghcr.io/OWNER/apex}:${APEX_TAG_WEB:-latest}
    command: ["start-web"]
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_WEB:-${DATABASE_URL}}   # one database user per app once the grants are applied (docs/split-plan.md section 5)
    depends_on:
      db: { condition: service_healthy }
    expose: ["3000"]
    # The image has its own HEALTHCHECK (GET /api/health); Caddy waits for the website.
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  admin:
    image: ${APEX_IMAGE:-ghcr.io/OWNER/apex}:${APEX_TAG_ADMIN:-latest}
    command: ["start-admin"]
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_ADMIN:-${DATABASE_URL}}
    depends_on:
      db: { condition: service_healthy }
    expose: ["3000"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  crm:
    image: ${APEX_IMAGE:-ghcr.io/OWNER/apex}:${APEX_TAG_CRM:-latest}
    command: ["start-crm"]
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_CRM:-${DATABASE_URL}}
    depends_on:
      db: { condition: service_healthy }
    expose: ["3000"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  forms:
    image: ${APEX_IMAGE:-ghcr.io/OWNER/apex}:${APEX_TAG_FORMS:-latest}
    command: ["start-forms"]
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_FORMS:-${DATABASE_URL}}
    depends_on:
      db: { condition: service_healthy }
    expose: ["3000"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      CRM_DOMAIN: ${CRM_DOMAIN:-crm.${SITE_DOMAIN}}   # where the CRM app lives (DNS record needed, like the main domain)
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.${SITE_DOMAIN}}   # where the CMS admin lives (DNS record needed too)
      FORMS_DOMAIN: ${FORMS_DOMAIN:-forms.${SITE_DOMAIN}}   # where the Forms app (builder, responses) lives (own DNS record and certificate)
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}   # who may open the admins; empty = nobody
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
