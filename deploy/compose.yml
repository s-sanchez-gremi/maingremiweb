# One ENVIRONMENT per server directory (e.g. /srv/apex/production). The database is IONOS Managed PostgreSQL and the files
# are IONOS S3, so this stack only has the two apps (web = website + CMS, crm = CRM, forms, ERP, portal) and the web server. Configuration lives in ./.env (never in git).
name: ${APEX_ENV:-apex}
services:
  web:
    image: ${APEX_IMAGE:-ghcr.io/OWNER/apex}:${APEX_TAG_WEB:-latest}
    command: ["start-web"]
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_WEB:-${DATABASE_URL}}   # one database user per app once the grants are applied (docs/split-plan.md section 5)
    expose: ["3000"]
    # The image has its own HEALTHCHECK (GET /api/health); Caddy waits for the website.
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  crm:
    image: ${APEX_IMAGE:-ghcr.io/OWNER/apex}:${APEX_TAG_CRM:-latest}
    command: ["start-crm"]
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_CRM:-${DATABASE_URL}}
    expose: ["3000"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }   # the public site gates the edge; the CRM app can come and go without taking the site down
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      CRM_DOMAIN: ${CRM_DOMAIN:-crm.${SITE_DOMAIN}}   # where the CRM app lives (DNS record needed, like the main domain)
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}   # who may open the admins; empty = nobody
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep this volume, or Let's Encrypt rate limits bite on re-creation
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
